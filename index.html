<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>DevSoft Suite</title>
<style>
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%; margin:0; padding:0; background:#0d0f14; font-family:'Rajdhani',sans-serif;}
body{display:flex; flex-direction:column;}
.tabbar{flex-shrink:0; display:flex; background:#161923; border-bottom:1px solid #2a2f42;
  position:sticky; top:0; z-index:100; padding-top:env(safe-area-inset-top);}
.tabbar button{flex:1; padding:14px 4px; background:transparent; border:none; color:#9aa0b4;
  font-weight:800; font-size:13px; font-family:'Rajdhani',sans-serif; letter-spacing:.5px;
  border-bottom:3px solid transparent; transition:color .15s, border-color .15s;}
.tabbar button.active{color:#00e5ff; border-bottom-color:#00e5ff;}
.frame-wrap{flex:1; position:relative; min-height:0;}
.app-frame{position:absolute; inset:0; width:100%; height:100%; border:none; display:none; background:#0d0f14;}
.app-frame.active{display:block;}
.loading-msg{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  color:#9aa0b4; font-size:13px; font-family:'Rajdhani',sans-serif; pointer-events:none;}
</style>
</head>
<body>

<div class="tabbar" id="tabbar">
  <button class="active" data-app="lotto" onclick="switchApp(this,'lotto')">🎱 Lotto</button>
  <button data-app="daily" onclick="switchApp(this,'daily')">📅 Daily Lotto</button>
  <button data-app="powerball" onclick="switchApp(this,'powerball')">⚡ Powerball</button>
</div>

<div class="frame-wrap">
  <div class="loading-msg" id="loadingMsg">Loading DevSoft Suite…</div>
  <iframe id="frame-lotto" class="app-frame active" title="Lotto"></iframe>
  <iframe id="frame-daily" class="app-frame" title="Daily Lotto"></iframe>
  <iframe id="frame-powerball" class="app-frame" title="Powerball"></iframe>
</div>

<script>
function switchApp(btn, key){
  document.querySelectorAll('.app-frame').forEach(f=>f.classList.remove('active'));
  document.getElementById('frame-'+key).classList.add('active');
  document.querySelectorAll('#tabbar button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}
function b64ToHtml(b64){
  const bytes = Uint8Array.from(atob(b64), c=>c.charCodeAt(0));
  return new TextDecoder('utf-8').decode(bytes);
}
function loadFrame(id, b64){
  const html = b64ToHtml(b64);
  document.getElementById(id).srcdoc = html;
}
